<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomMatch - สมัครสมาชิก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col relative">

    <!-- Header / Navbar -->
    <header class="bg-white/85 backdrop-blur-md border-b border-slate-200/60 sticky top-0 z-40 py-3.5 px-6 sm:px-8 shadow-xs">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 cursor-pointer hover:opacity-90 transition no-underline group">
                <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-md shadow-blue-500/25 group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-house text-lg"></i>
                </div>
                <div class="flex flex-col">
                    <span class="font-bold text-xl text-slate-900 tracking-tight leading-none">RoomMatch</span>
                    <span class="text-[10px] font-semibold text-blue-600 tracking-wider uppercase mt-0.5">AI Spatial Studio</span>
                </div>
            </a>
            
            <a href="index.html" class="px-5 py-2.5 text-xs sm:text-sm font-semibold rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200 hover:text-slate-900 transition flex items-center gap-2 no-underline">
                <i class="fa-solid fa-arrow-left text-xs"></i>
                <span>กลับหน้าแรก</span>
            </a>
        </div>
    </header>

    <!-- แจ้งเตือน Notification -->
    <div id="alert-container" class="fixed top-20 right-6 z-50 flex flex-col gap-2"></div>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <section class="w-full max-w-[480px]">
            <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-2xl border border-slate-200/80 relative overflow-hidden">
                <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600"></div>
                <div class="text-center mb-6">
                    <h2 class="text-3xl font-bold mb-2 text-slate-800">สมัครสมาชิก</h2>
                    <p class="text-slate-500">สร้างบัญชีเพื่อเริ่มต้นใช้งาน RoomMatch</p>
                </div>
                
                <!-- Google Sign-Up Button -->
                <button type="button" onclick="startGoogleAuth('register')" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-slate-50 text-slate-700 font-semibold py-3.5 px-4 rounded-xl border border-slate-300 shadow-xs hover:shadow-md transition-all cursor-pointer group mb-5">
                    <svg class="w-5 h-5 flex-shrink-0 transition-transform group-hover:scale-110" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>สมัครสมาชิกด้วย Google</span>
                </button>

                <!-- Divider -->
                <div class="relative flex items-center justify-center my-6">
                    <div class="border-t border-slate-200 w-full"></div>
                    <span class="bg-white px-3 text-xs uppercase tracking-wider text-slate-400 font-semibold absolute">หรือกรอกข้อมูลสมัครสมาชิก</span>
                </div>
                
                <form id="register-form" class="flex flex-col gap-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">ชื่อผู้ใช้ (Username)</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-solid fa-user"></i></span>
                            <input type="text" id="reg-username" required placeholder="กรอกชื่อผู้ใช้" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 pl-11 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">อีเมล (Email)</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" id="reg-email" required placeholder="example@email.com" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 pl-11 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">รหัสผ่าน (Password)</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="reg-password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 pl-11 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">ยืนยันรหัสผ่าน (Confirm Password)</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="reg-confirm" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 pl-11 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition">
                        </div>
                    </div>

                    <!-- เพิ่มช่องเลือกประเภทบัญชีตรงนี้ -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">ประเภทบัญชี</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-solid fa-id-badge"></i></span>
                            <select id="reg-role" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 pl-11 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition appearance-none cursor-pointer">
                                <option value="customer">ผู้ใช้งานทั่วไป (ออกแบบห้อง / ซื้อสินค้า)</option>
                                <option value="seller">ร้านค้า (ลงขายสินค้า / จัดการคลัง)</option>
                            </select>
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><i class="fa-solid fa-chevron-down"></i></span>
                        </div>
                    </div>

                    <button type="submit" id="btn-submit-register" class="w-full bg-blue-600 text-white rounded-xl py-3.5 font-bold hover:bg-blue-700 transition flex justify-center items-center gap-2 border-none cursor-pointer shadow-md shadow-blue-100 mt-2">
                        <span>ลงทะเบียน</span>
                        <i class="fa-solid fa-spinner fa-spin hidden" id="reg-spinner"></i>
                    </button>
                </form>

                <div class="mt-6 text-center text-sm text-slate-500">
                    มีบัญชีอยู่แล้ว? <a href="index.html?action=login" class="text-blue-600 font-bold hover:underline">เข้าสู่ระบบที่นี่</a>
                </div>
            </div>
        </section>
    </main>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 hidden [&.active]:flex flex-col items-center justify-center">
        <div class="relative w-20 h-20 mb-4">
            <div class="absolute inset-0 rounded-full border-4 border-slate-100"></div>
            <div class="absolute inset-0 rounded-full border-4 border-blue-500 border-t-transparent animate-spin"></div>
        </div>
        <h3 class="text-lg font-bold text-slate-800">กำลังดำเนินการ...</h3>
    </div>

    <script src="app.js?v=19"></script>
</body>
</html>
